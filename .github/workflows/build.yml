name: Build Windows Updater
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**","requirements-build.txt","scripts/Build-Release.ps1",".github/workflows/build.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build
        shell: powershell
        run: ./scripts/Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: 506th-Arma3-Mod-Sync-Windows-x64
          path: |
            release/506th-Arma3-Mod-Sync-v5.0.0-Windows-x64.zip
            release/SHA256SUMS.txt
